services:
  web:
    build: fastapi
    ports:
      - 8000:8000
    volumes:
      - ./fastapi:/app
    networks:
      - ollama-net
    depends_on:
      - ollama
  ollama:
    build: ollama
    ports:
      - 11435:11434 
    volumes:
      - ./ollama:/app
    networks:
      - ollama-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["/usr/bin/bash", "pull-model.sh"]

networks:
  ollama-net:
    driver: bridge